    <text x="80" y="320" fill="#94a3b8" font-size="11">ISSUER: DeepLearning.AI / Kaggle</text>
    <text x="520" y="320" text-anchor="end" fill="#c770f0" font-family="monospace" font-size="12" font-weight="bold">ID: DL-CV-849201</text>
