<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
    <defs>
      <linearGradient id="dl_bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#140727"/>
        <stop offset="50%" stop-color="#2a0e4a"/>
        <stop offset="100%" stop-color="#0f041d"/>
      </linearGradient>
      <linearGradient id="purple_grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#c770f0"/>
        <stop offset="100%" stop-color="#a855f7"/>
      </linearGradient>
    </defs>

    <rect width="600" height="380" rx="16" fill="url(#dl_bg)" stroke="#c770f0" stroke-width="3"/>
    <rect x="15" y="15" width="570" height="350" rx="10" fill="none" stroke="rgba(199,112,240,0.3)" stroke-width="1.5"/>

    <!-- Neural Network Node Graphic -->
    <g stroke="rgba(199,112,240,0.3)" stroke-width="1.5">
      <line x1="50" y1="60" x2="120" y2="100"/><line x1="50" y1="120" x2="120" y2="100"/><line x1="120" y1="100" x2="190" y2="70"/>
      <line x1="550" y1="60" x2="480" y2="100"/><line x1="550" y1="120" x2="480" y2="100"/>
    </g>
    <circle cx="120" cy="100" r="5" fill="#c770f0"/><circle cx="480" cy="100" r="5" fill="#38bdf8"/>

    <text x="300" y="55" text-anchor="middle" fill="#c770f0" font-family="system-ui, sans-serif" font-size="13" letter-spacing="3" font-weight="bold">SPECIALIZATION CERTIFICATE</text>
    <text x="300" y="82" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="21" font-weight="900">DEEP LEARNING &amp; COMPUTER VISION</text>
    
    <text x="300" y="125" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Awarded to</text>
    <text x="300" y="162" text-anchor="middle" fill="#38bdf8" font-family="Georgia, serif" font-size="28" font-weight="bold">S DURGA PRASAD</text>
    <text x="300" y="190" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14">For demonstrating mastery in Deep Convolutional Neural Networks &amp; Monocular Vision</text>

    <!-- Tech Badges -->
    <g transform="translate(130, 215)">
      <rect x="0" y="0" width="80" height="26" rx="13" fill="rgba(199,112,240,0.2)" stroke="#c770f0"/>
      <text x="40" y="17" text-anchor="middle" fill="#c770f0" font-size="11" font-weight="bold">PyTorch</text>
      <rect x="90" y="0" width="80" height="26" rx="13" fill="rgba(56,189,248,0.2)" stroke="#38bdf8"/>
      <text x="130" y="17" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold">YOLOv8</text>
      <rect x="180" y="0" width="80" height="26" rx="13" fill="rgba(234,179,8,0.2)" stroke="#eab308"/>
      <text x="220" y="17" text-anchor="middle" fill="#eab308" font-size="11" font-weight="bold">MiDaS</text>
      <rect x="270" y="0" width="80" height="26" rx="13" fill="rgba(16,185,129,0.2)" stroke="#10b981"/>
      <text x="310" y="17" text-anchor="middle" fill="#10b981" font-size="11" font-weight="bold">OpenCV</text>
