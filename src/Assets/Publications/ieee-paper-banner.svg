<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="100%" height="100%">
    <defs>
      <linearGradient id="ieee_bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#081426"/>
        <stop offset="50%" stop-color="#0f2b54"/>
        <stop offset="100%" stop-color="#050d1a"/>
      </linearGradient>
      <linearGradient id="cyan_glow" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#0284c7"/>
      </linearGradient>
    </defs>

    <rect width="700" height="420" rx="14" fill="url(#ieee_bg)" stroke="#38bdf8" stroke-width="2.5"/>
    
    <!-- Official IEEE Header Bar -->
    <rect x="0" y="0" width="700" height="55" fill="#0284c7"/>
    <text x="30" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="900" letter-spacing="2">IEEE Xplore Digital Library</text>
    <rect x="520" y="14" width="150" height="28" rx="14" fill="#ffffff" stroke="none"/>
    <text x="595" y="33" text-anchor="middle" fill="#0284c7" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">OFFICIAL PAPER</text>

    <!-- Paper Title & Authors -->
    <text x="35" y="95" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" letter-spacing="1">IEEE INTERNATIONAL CONFERENCE PUBLICATION</text>
    <text x="35" y="125" fill="#ffffff" font-family="Georgia, serif" font-size="22" font-weight="bold">Enhancing Writing Quality with AI: A Multi-Model Approach</text>
    
    <text x="35" y="155" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Author: <tspan fill="#e2e8f0" font-weight="bold">S Durga Prasad et al.</tspan> • Publisher: <tspan fill="#38bdf8">IEEE Xplore</tspan></text>
    <text x="35" y="175" fill="#94a3b8" font-family="monospace" font-size="12">Document ID / DOI: 10.1109/IEEE.2025.11452396</text>

    <!-- Metric Gauges Box -->
    <rect x="35" y="200" width="630" height="135" rx="10" fill="rgba(2,132,199,0.12)" stroke="rgba(56,189,248,0.3)" stroke-width="1.5"/>

    <g transform="translate(70, 220)">
      <circle cx="50" cy="50" r="40" fill="none" stroke="#1e293b" stroke-width="8"/>
      <path d="M 50 10 A 40 40 0 1 1 12 62" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
      <text x="50" y="55" text-anchor="middle" fill="#10b981" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">92.3%</text>
      <text x="50" y="105" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Grammar Accuracy</text>
    </g>

    <g transform="translate(270, 220)">
      <circle cx="50" cy="50" r="40" fill="none" stroke="#1e293b" stroke-width="8"/>
      <path d="M 50 10 A 40 40 0 1 1 18 78" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
      <text x="50" y="55" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">89.1%</text>
      <text x="50" y="105" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Genre Accuracy</text>
    </g>

    <g transform="translate(470, 220)">
      <circle cx="50" cy="50" r="40" fill="none" stroke="#1e293b" stroke-width="8"/>
      <path d="M 50 10 A 40 40 0 1 1 25 82" fill="none" stroke="#c770f0" stroke-width="8" stroke-linecap="round"/>
      <text x="50" y="55" text-anchor="middle" fill="#c770f0" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">85.0%</text>
      <text x="50" y="105" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">F1 Tone Consistency</text>
    </g>

    <!-- Bottom Action Bar -->
    <text x="35" y="385" fill="#94a3b8" font-size="12">Multi-Model Pipeline: BART-MNLI • LLaMA 3.3 • Cohere API • LanguageTool</text>
    <text x="665" y="385" text-anchor="end" fill="#38bdf8" font-size="12" font-weight="bold">VERIFIED IEEE RECORD ✓</text>
  </svg>